<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Northwind Labs X (Twitter) Profile picture template</title>
  <desc id="desc">Template 400x400px. Keep text and logos inside the dashed safe zone. Text colour #ffffff on #0f6e7a = 5.9:1. Delete the "guides" group before export.</desc>
  <rect id="background" width="400" height="400" fill="#0f6e7a"/>
  <g id="artwork"><image href="data:image/svg+xml;base64," x="76" y="76" width="248" height="248" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="guides" fill="none" stroke="#ff00aa" stroke-width="2" stroke-dasharray="12 8">
    <rect x="32" y="32" width="336" height="336"/>
    <circle cx="200.0" cy="200.0" r="200.0"/>
  </g>
</svg>
