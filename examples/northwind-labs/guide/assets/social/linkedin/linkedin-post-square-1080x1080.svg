<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Northwind Labs LinkedIn Post image (square) template</title>
  <desc id="desc">Template 1080x1080px. Keep text and logos inside the dashed safe zone. Text colour #ffffff on #1b2a3a = 14.6:1. Delete the "guides" group before export.</desc>
  <rect id="background" width="1080" height="1080" fill="#1b2a3a"/>
  <g id="artwork"><image href="data:image/svg+xml;base64," x="86" y="920" width="363" height="74" preserveAspectRatio="xMinYMax meet"/><text x="86" y="172" font-family="'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="700" fill="#ffffff">Headline: one idea, few words</text><text x="86" y="272" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" fill="#ffffff">Supporting line (contrast 14.6:1)</text></g>
  <g id="guides" fill="none" stroke="#ff00aa" stroke-width="2" stroke-dasharray="12 8">
    <rect x="86" y="86" width="907" height="907"/>
    
  </g>
</svg>
