<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Northwind Labs YouTube Channel icon template</title>
  <desc id="desc">Template 800x800px. Keep text and logos inside the dashed safe zone. Text colour #ffffff on #0f6e7a = 5.9:1. Delete the "guides" group before export.</desc>
  <rect id="background" width="800" height="800" fill="#0f6e7a"/>
  <g id="artwork"><image href="data:image/svg+xml;base64," x="152" y="152" width="496" height="496" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="guides" fill="none" stroke="#ff00aa" stroke-width="2" stroke-dasharray="12 8">
    <rect x="64" y="64" width="672" height="672"/>
    <circle cx="400.0" cy="400.0" r="400.0"/>
  </g>
</svg>
